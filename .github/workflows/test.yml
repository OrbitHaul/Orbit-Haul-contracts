name: OrbitHaul Smart Contracts CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Run format check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          target: wasm32-unknown-unknown

      - name: Run clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Run core tests
        run: cargo test --package shipment test:: -- --test-threads=1 --nocapture
      - name: Run e2e tests
        run: cargo test --package shipment e2e_test:: -- --test-threads=1 --nocapture
      - name: Run replay protection tests
        run: cargo test --package shipment actor_quota_tests:: -- --test-threads=1 --nocapture
      - name: Run performance tests
        run: cargo test --package shipment test_performance:: -- --test-threads=1 --nocapture
      - name: Run consistency tests
        run: cargo test --package shipment test_consistency:: -- --test-threads=1 --nocapture
      - name: Run remaining tests
        run: cargo test --package shipment -- --test-threads=1 --nocapture --skip test:: --skip e2e_test:: --skip actor_quota_tests:: --skip test_performance:: --skip test_consistency::

  cargo-build:
    name: Cargo Build (Host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Build host targets
        run: cargo build --all-targets

  wasm-build:
    name: Build WASM Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Build WASM targets
        run: cargo build --target wasm32-unknown-unknown --release
