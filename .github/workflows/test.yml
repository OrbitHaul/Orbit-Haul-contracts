name: OrbitHaul Smart Contracts CI

permissions:
  contents: write

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Run format check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          target: wasm32-unknown-unknown

      - name: Run clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Run orbit-haul-token tests
        run: cargo test --package orbit-haul-token -- --test-threads=1

      - name: Run shipment tests
        id: run_tests
        run: |
          cargo test --package shipment -- --test-threads=1 --nocapture 2>&1 | tee /tmp/test_out.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Save test output to cargo.log
        if: always()
        run: |
          if [ -f /tmp/test_out.txt ]; then
            git config user.email "ci@orbithaul.io"
            git config user.name "OrbitHaul CI"
            cp /tmp/test_out.txt cargo.log
            git add cargo.log
            git diff --staged --quiet || git commit -m "ci: update cargo.log [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Fail if tests failed
        if: steps.run_tests.outputs.exit_code != '0'
        run: exit 1

  cargo-build:
    name: Cargo Build (Host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Build host targets
        run: cargo build --all-targets

  wasm-build:
    name: Build WASM Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Build WASM targets
        run: cargo build --target wasm32-unknown-unknown --release
